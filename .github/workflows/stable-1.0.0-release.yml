name: Stable 1.0.0 Release

on:
  push:
    branches:
      - release/1.0.0-stable

permissions:
  contents: write

concurrency:
  group: stable-release-1.0.0
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, package, and publish v1.0.0
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FFmpeg development libraries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Configure Windows x64 Release
        run: cmake -S engine -B engine/build -G "Visual Studio 17 2022" -A x64 "-DVAC3_VERSION=1.0.0"

      - name: Build Release
        run: cmake --build engine/build --config Release

      - name: Run unit tests
        run: ctest --test-dir engine/build -C Release --output-on-failure

      - name: Assemble distribution
        shell: pwsh
        run: |
          $d = "dist"
          New-Item -ItemType Directory -Force -Path "$d/scripts" | Out-Null
          Copy-Item engine/build/Release/*.exe $d
          Copy-Item engine/build/Release/*.dll $d
          foreach ($runtime in 'VCRUNTIME140.dll', 'VCRUNTIME140_1.dll', 'MSVCP140.dll') {
            $source = Join-Path "$env:WINDIR/System32" $runtime
            if (Test-Path $source) { Copy-Item $source $d -Force }
          }
          Copy-Item scripts/*.ps1 "$d/scripts"
          Copy-Item README.md, LICENSE, NOTICE.md, CLAUDE.md "$d"
          Copy-Item installer/supervisor.vbs, installer/stop-engine.ps1, installer/app.ico "$d"
          Copy-Item installer/quickstart.txt "$d/QUICKSTART.txt"
          Copy-Item installer/default.conf "$d/virtual-ac3-encoder.conf"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "virtual-ac3-encoder-1.0.0-win64.zip" -Force

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            $iscc = if ($cmd) { $cmd.Source } else { "$env:ProgramData\chocolatey\bin\ISCC.exe" }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          $src = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=1.0.0" "/DSourceDir=$src" installer/virtual-ac3-encoder.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "virtual-ac3-encoder-1.0.0-win64.zip",
            "installer/Output/virtual-ac3-encoder-setup-1.0.0.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-ac3-encoder-1.0.0-stable-win64
          path: |
            virtual-ac3-encoder-1.0.0-win64.zip
            installer/Output/virtual-ac3-encoder-setup-1.0.0.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0"
          $zip = "virtual-ac3-encoder-1.0.0-win64.zip"
          $installer = "installer/Output/virtual-ac3-encoder-setup-1.0.0.exe"
          $notes = @'
          # Dolby Control Center 1.0.0 Stable

          Stable release based on the project's v0.2.9-beta source.

          ## Changes in 1.0.0
          - Fixed the STREAM DIAGNOSTICS crash: the Control Center opens telemetry through a read-only shared-memory mapping and now reads those values without issuing write-modifying Interlocked operations.
          - No changes to AC-3/DTS encoding, bitrate, frame size, WASAPI periods, latency presets, capture/render paths, queueing, RingBuffer, DSP/upmix, or driver code compared with v0.2.9-beta.

          ## Validation
          - Windows x64 Release build
          - CTest unit-test suite
          - Portable ZIP and Inno Setup installer packaging

          Hardware-specific long-duration audio validation remains dependent on the target PC, audio endpoint, and receiver.

          ## Downloads
          - virtual-ac3-encoder-setup-1.0.0.exe: per-user Windows installer
          - virtual-ac3-encoder-1.0.0-win64.zip: portable Windows x64 build
          - SHA256SUMS.txt: SHA-256 hashes for the two binaries
          '@
          gh release create $tag --target $env:GITHUB_SHA --title "1.0.0 Stable" --notes $notes $zip $installer SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed ($LASTEXITCODE)" }
