name: Render 128 low-latency test build

on:
  push:
    branches:
      - perf/render-buffer-128-safe-ladder

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build, test, and package Windows x64 portable build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FFmpeg development libraries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Configure (Visual Studio 2022 x64)
        run: cmake -S engine -B engine/build -G "Visual Studio 17 2022" -A x64 "-DVAC3_VERSION=0.2.10-beta-render128"

      - name: Build Release
        run: cmake --build engine/build --config Release

      - name: Run unit tests
        run: ctest --test-dir engine/build -C Release --output-on-failure

      - name: Assemble portable package
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item engine/build/Release/*.exe $dist
          Copy-Item engine/build/Release/*.dll $dist
          foreach ($runtime in 'VCRUNTIME140.dll', 'VCRUNTIME140_1.dll', 'MSVCP140.dll') {
            $source = Join-Path "$env:WINDIR/System32" $runtime
            if (Test-Path $source) { Copy-Item $source $dist -Force }
          }
          New-Item -ItemType Directory -Force -Path "$dist/scripts" | Out-Null
          Copy-Item scripts/*.ps1 "$dist/scripts"
          Copy-Item README.md, LICENSE, NOTICE.md "$dist"
          Copy-Item installer/default.conf "$dist/virtual-ac3-encoder.conf"
          Copy-Item installer/quickstart.txt "$dist/QUICKSTART.txt"
          Copy-Item installer/supervisor.vbs, installer/stop-engine.ps1 "$dist"
          Compress-Archive -Path "$dist/*" -DestinationPath "virtual-ac3-encoder-0.2.10-beta-render128-win64.zip" -Force

      - name: Upload test build artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtual-ac3-encoder-0.2.10-beta-render128-win64
          path: virtual-ac3-encoder-0.2.10-beta-render128-win64.zip
          if-no-files-found: error
          retention-days: 14
