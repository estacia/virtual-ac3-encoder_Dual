name: One-time cleanup unintended stable 0.2.5 Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-extra-release-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the unintended v0.2.5 Release entry and verify tags remain
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          releases="$(gh api "repos/${GH_REPO}/releases?per_page=100")"
          target="$(jq -c '[.[] | select(.tag_name == "v0.2.5") ]' <<< "$releases")"
          count="$(jq 'length' <<< "$target")"

          if [[ "$count" -gt 1 ]]; then
            echo "More than one v0.2.5 Release entry found; refusing ambiguous cleanup."
            exit 1
          fi
          if [[ "$count" -eq 1 ]]; then
            release_id="$(jq -r '.[0].id' <<< "$target")"
            echo "Deleting unwanted v0.2.5 Release entry ID $release_id; preserving the Git tag."
            gh api -X DELETE "repos/${GH_REPO}/releases/$release_id" >/dev/null
          else
            echo "No v0.2.5 Release entry remains; continuing verification."
          fi

          gh api "repos/${GH_REPO}/git/ref/tags/v0.2.5" >/dev/null

          final="$(gh api "repos/${GH_REPO}/releases?per_page=100")"
          jq -e '
            ([.[] | select(.tag_name == "v0.2.5")] | length == 0) and
            ([.[] | select(.tag_name == "v0.2.4" and .name == "0.2.4-stable")] | length == 1) and
            ([.[] | select(.tag_name == "v0.2.5-beta" and .name == "0.2.5-beta")] | length == 1) and
            ([.[] | select(.tag_name == "v0.2.6-beta2" and .name == "0.2.6-beta2" and .prerelease == true)] | length == 1) and
            (length == 3)
          ' <<< "$final" >/dev/null

          echo "Verified: stable 0.2.4 and beta releases 0.2.5-beta / 0.2.6-beta2 remain; v0.2.5 tag is preserved."
