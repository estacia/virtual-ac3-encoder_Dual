# Virtual AC3 Encoder configuration.  (Restart the engine, or log off+on, after editing.)

# Capture the render-only virtual 5.1 endpoint through WASAPI loopback:
in=CABLE Input

# Output: auto-pick the first S/PDIF (optical) output that accepts AC3/DTS:
out_spdif=1

bitrate=640000
loopback=1

# Stereo upmix: surround (FFT Dynamic Surround), time_domain (matrix with content-based stereo/native detection),
# time_domain_51 (same matrix; stereo inside 5.1/7.1 is upmixed, discrete channels are protected at -80 dBFS),
# dual_stereo (direct L/R rear copy), or off.
upmix=surround

# Speaker layout used by Dynamic/Always Surround, Dual Stereo Copy, and Time-domain Matrix + Native 5.1 Untouched:
# 4.0 redirects native Center to FL/FR at -3 dB each, and LFE to FL/FR using
# ITU-R BS.775-4 (+10 dB LFE reproduction compensation, -6 dB per front channel).
# For Dynamic/Always Surround stereo upmix, synthetic Center/LFE are omitted while FL/FR and SL/SR remain active.
# 5.1 preserves native Center and LFE in their original channels.
speaker_layout=4.0

# Physical output mode: "ac3" (Dolby Digital 5.1, default), "dts" (DTS 5.1), or "pcm" (stereo PCM):
output_mode=ac3

# DTS bitrate when output_mode=dts: "full" (1536000 bps / 1.5 Mbps, default) or "half" (768000 bps):
dts_rate=full

# Latency preset: "extreme", "fast", "balanced" (default), "safe", or "relaxed"
# Loopback is required for render-only virtual 5.1 devices and uses the Windows audio-engine period.
# For a recording endpoint (e.g. VB-CABLE CABLE Output), set loopback=0 to request IAudioClient3:
# 5 ms in Extreme/Fast/Balanced, or 10 ms in Safe/Relaxed, when supported.
#   extreme  : lowest built-in cushion (DTS 512 / AC-3 128 samples) and 1024-sample upmix FFT window
#              Optional safe=64 is an aggressive AC-3 experiment; start at safe=128.
#   fast     : low latency gaming (~5 ms DTS / ~10 ms AC3)
#   balanced : recommended balance of low latency & stability (~10 ms DTS / ~16 ms AC3)
#   safe     : high compatibility (~16 ms DTS / ~21 ms AC3)
#   relaxed  : maximum safety against dropouts (~32 ms)
latency=balanced

# Custom safe frames buffer override (optional; overrides the selected latency preset):
# safe=128
# safe=64  # aggressive AC-3 experiment; may cause dropouts
